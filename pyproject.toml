[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hothello"
version = "0.1.0"
description = "A different piece of ASCII art from asciiart.website, plus news headlines, at every login."
readme = "README.md"
requires-python = ">=3.10"
# The login path (`hothello show`) is stdlib-only; Textual powers the settings UI and
# Pillow turns news pictures into art during the background refresh.
dependencies = ["textual>=1.0", "pillow>=9.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hothello = "hothello.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hothello = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
